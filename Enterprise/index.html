<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise WebOffice Suite (Word & Excel Clone)</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6718454554209533"
     crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet/dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet/dist/css/luckysheet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet/dist/assets/iconfont/iconfont.css" />
    <script src="https://cdn.jsdelivr.net/npm/luckysheet/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet/dist/luckysheet.umd.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js" referrerpolicy="origin"></script>

    <style>
        :root {
            --word-color: #107c41;
            --excel-color: #107c41;
            --sidebar-bg: #201f1e;
            --topbar-bg: #f3f2f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #f3f2f1;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Navigasi Samping ala Office 365 */
        .office-sidebar {
            width: 65px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            gap: 20px;
            flex-shrink: 0;
        }

        .sidebar-btn {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            border: none;
            background: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .sidebar-btn:hover {
            background-color: #323130;
        }

        .sidebar-btn.active[data-mod="word"] { background-color: #1b3d6f; color: white; }
        .sidebar-btn.active[data-mod="excel"] { background-color: #107c41; color: white; }

        /* Area Konten Utama */
        .main-workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* Header Atas */
        .office-topbar {
            height: 45px;
            background-color: var(--topbar-bg);
            border-bottom: 1px solid #edebe9;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        .app-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #323130;
        }

        .save-btn {
            background-color: #ffffff;
            border: 1px solid #8a8886;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .save-btn:hover { background-color: #f3f2f1; }

        /* Kontainer Modul */
        .module-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: calc(100% - 45px);
        }

        .office-module {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .office-module.active {
            display: block;
        }

        /* Kustomisasi Khusus Microsoft Word Container */
        #mod-word {
            background-color: #f3f2f1;
            overflow-y: auto;
            padding-top: 10px;
        }

        /* Kustomisasi Microsoft Excel Container */
        #luckysheet-container {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        /* Memaksa TinyMCE agar terlihat seperti halaman kertas Word */
        .tox-tinymce {
            border: none !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="office-sidebar">
            <div style="color: #fff; font-size: 1.5rem; margin-bottom: 20px;"><i class="fa-solid fa-grid-2"></i></div>
            <button class="sidebar-btn active" data-mod="word" title="Microsoft Word"><i class="fa-solid fa-file-word" style="color: #2b579a;"></i></button>
            <button class="sidebar-btn" data-mod="excel" title="Microsoft Excel"><i class="fa-solid fa-file-excel" style="color: #107c41;"></i></button>
        </aside>

        <main class="main-workspace">
            <header class="office-topbar">
                <div class="app-title" id="office-suite-title">Microsoft Word Online Clone</div>
                <button class="save-btn" id="save-all-data"><i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Browser</button>
            </header>

            <div class="module-container">
                
                <div id="mod-word" class="office-module active">
                    <textarea id="word-editor-instance">
                        <p style="text-align: center;"><span style="font-size: 18pt;"><strong>DOKUMEN KERJA KARYAWAN</strong></span></p>
                        <p style="text-align: center;">&nbsp;</p>
                        <p>Mulai ketik laporan kerja atau dokumen formal Anda di sini. Fitur ini sudah mendukung penyisipan tabel, pemformatan teks lengkap (*bold*, *italic*, pewarnaan), perataan paragraf, hingga pengaturan gaya dokumen layaknya aplikasi desktop.</p>
                    </textarea>
                </div>

                <div id="mod-excel" class="office-module">
                    <div id="luckysheet-container"></div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // --- MANAJEMEN ROUTING MODUL ---
        const navButtons = document.querySelectorAll('.sidebar-btn');
        const modules = document.querySelectorAll('.office-module');
        const titleBar = document.getElementById('office-suite-title');

        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                navButtons.forEach(b => b.classList.remove('active'));
                modules.forEach(m => m.classList.remove('active'));

                btn.classList.add('active');
                const target = btn.dataset.mod;
                document.getElementById(`mod-${target}`).classList.add('active');

                if (target === 'word') {
                    titleBar.innerText = "Microsoft Word Online Clone";
                } else if (target === 'excel') {
                    titleBar.innerText = "Microsoft Excel Online Clone";
                    // Paksa refresh layout engine excel saat tab dibuka agar grid lurus
                    luckysheet.resize();
                }
            });
        });

        // --- INISIALISASI WORD (TinyMCE dengan tema Ribbon Lengkap) ---
        tinymce.init({
            selector: '#word-editor-instance',
            plugins: 'advlist autolink lists link image charmap preview anchor searchreplace visualblocks code fullscreen insertdatetime media table code help wordcount',
            toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | table image | forecolor backcolor lineheight | help',
            menubar: 'file edit view insert format tools table help',
            branding: false,
            promotion: false,
            setup: function (editor) {
                editor.on('init', function () {
                    // Load data otomatis jika ada data tersimpan
                    const savedWord = localStorage.getItem('saved_word_data');
                    if (savedWord) editor.setContent(savedWord);
                });
            }
        });

        // --- INISIALISASI EXCEL (Luckysheet Full Formula & Cell Grid) ---
        // Mencoba mengambil data simpanan excel lama di localstorage
        let savedExcel = localStorage.getItem('saved_excel_data');
        let initialExcelData = [{
            "name": "Sheet1",
            "color": "",
            "status": "1",
            "order": "0",
            "data": [],
            "config": {},
            "celldata": [
                { "r": 0, "c": 0, "v": { "v": "No", "ct": { "fa": "General", "t": "g" }, "bl": 1 } },
                { "r": 0, "c": 1, "v": { "v": "Nama Produk", "ct": { "fa": "General", "t": "g" }, "bl": 1 } },
                { "r": 0, "c": 2, "v": { "v": "Harga", "ct": { "fa": "General", "t": "g" }, "bl": 1 } },
                { "r": 1, "c": 0, "v": "1" }, { "r": 1, "c": 1, "v": "Laptop Asus" }, { "r": 1, "c": 2, "v": 12000000 },
                { "r": 2, "c": 0, "v": "2" }, { "r": 2, "c": 1, "v": "Mouse Logitech" }, { "r": 2, "c": 2, "v": 250000 },
                { "r": 3, "c": 1, "v": { "v": "Total Dana:", "bl": 1 } },
                { "r": 3, "c": 2, "v": { "f": "=SUM(C2:C3)", "v": 12250000, "ct": { "fa": "General", "t": "n" } } }
            ]
        }];

        if (savedExcel) {
            try { initialExcelData = JSON.parse(savedExcel); } catch(e) { console.error(e); }
        }

        $(function () {
            luckysheet.create({
                container: 'luckysheet-container',
                lang: 'en', // Menggunakan bahasa inggris untuk standard rumus internasional (=SUM, =AVERAGE)
                allowUpdate: true,
                loadUrl: "",
                clearButton: false,
                showinfobar: false, // Menyembunyikan topbar bawaan agar menyatu dengan aplikasi kita
                data: initialExcelData
            });
        });

        // --- GLOBAL SAVE ENGINE (Menyimpan seluruh state data ke browser) ---
        document.getElementById('save-all-data').addEventListener('click', () => {
            // 1. Ambil data teks dari Editor Word
            const wordContent = tinymce.get('word-editor-instance').getContent();
            localStorage.setItem('saved_word_data', wordContent);

            // 2. Ambil data grid struktur dari Editor Excel (Luckysheet)
            const excelContent = luckysheet.getAllSheets();
            localStorage.setItem('saved_excel_data', JSON.stringify(excelContent));

            alert('Sukses! Seluruh data Word & Excel Anda telah disimpan ke dalam memori browser secara aman.');
        });
    </script>
</body>
</html>

<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen py-10 px-4">

    <div class="bg-gray-800 p-6 md:p-8 rounded-2xl shadow-2xl max-w-xl w-full border border-gray-700">
        <h1 class="text-3xl font-extrabold text-center mb-2 text-indigo-400">💝 Multi-Crypto Tip Jar</h1>
        <p class="text-gray-400 text-sm text-center mb-8">Pilih aset kripto yang ingin Anda gunakan untuk mengirim dukungan.</p>

        <!-- Pilihan Jaringan / Koin -->
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Pilih Aset Koin</label>
        <select id="crypto-select" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 mb-6 font-medium text-white focus:outline-none focus:border-indigo-500 cursor-pointer">
            <option value="eth">Ethereum (ETH / EVM) - Mendukung MetaMask</option>
            <option value="solana">Solana (SOL)</option>
            <option value="btc">Bitcoin (BTC)</option>
            <option value="inj">Injective (INJ)</option>
            <option value="doge">Dogecoin (DOGE)</option>
            <option value="ltc">Litecoin (LTC)</option>
            <option value="fio">FIO Protocol (FIO)</option>
            <option value="icp">Internet Computer (ICP)</option>
            <option value="iotx">IoTeX (IOTX)</option>
            <option value="zil">Zilliqa (ZIL)</option>
            <option value="egld">MultiversX (eGLD)</option>
            <option value="osmo">Osmosis (OSMO)</option>
            <option value="flux">Flux (FLUX)</option>
            <option value="juno">Juno (JUNO)</option>
            <option value="firo">Firo (FIRO)</option>
            <option value="xrp">Ripple (XRP)</option>
            <option value="trx">TRON (TRX)</option>
        </select>

        <!-- Tampilan Alamat Dompet -->
        <div class="mb-6 p-4 bg-gray-950 rounded-xl border border-gray-800 relative">
            <span id="crypto-label" class="text-xs text-indigo-400 font-bold uppercase tracking-wider block mb-1">Alamat ETH</span>
            <p id="wallet-address" class="text-sm font-mono text-gray-300 break-all select-all font-semibold">0x5e8bade6e0bce65807db6327cb1d9eeb7c6a6a5b</p>
            <button id="btn-copy" class="mt-2 text-xs bg-gray-800 hover:bg-gray-700 text-indigo-300 px-3 py-1 rounded-md transition cursor-pointer">📋 Salin Alamat</button>
        </div>

        <!-- Area Interaksi Web3 Khusus ETH -->
        <div id="eth-web3-section" class="space-y-3 p-4 bg-gray-900/50 rounded-xl border border-gray-800">
            <span class="text-xs text-amber-400 font-semibold block uppercase">Interaksi Dompet Langsung (Khusus ETH)</span>
            <p id="wallet-status" class="text-xs font-mono text-gray-400 mb-2">MetaMask belum terhubung</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <button id="btn-connect" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm py-3 px-4 rounded-xl transition duration-200 cursor-pointer">🔌 Hubungkan MetaMask</button>
                <button id="btn-send" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm py-3 px-4 rounded-xl transition duration-200 opacity-50 cursor-not-allowed" disabled>💝 Kirim via Web3 (0.001 ETH)</button>
            </div>
        </div>
    </div>

    <!-- Memuat library Ethers.js v5 dari CDN untuk fitur Web3 ETH -->
    <script src="https://jsdelivr.net" type="text/javascript"></script>
    <script src="app.js"></script>
</body>
</html>
